[project]
name = "assistant-mcp"
version = "0.3.0"
description = "Modular MCP server built on FastMCP, deployed on Cloud Run"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.1.0",
    "google-cloud-firestore>=2.34.1",
    "markdown-it-py>=3.0.0",
    "pydantic>=2",
    "reportlab>=4.2.0",
]

[project.scripts]
assistant-mcp = "assistant_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_mcp"]

[dependency-groups]
dev = [
    "pypdf>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "types-reportlab>=3.6.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "httpx2>=2.13.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
