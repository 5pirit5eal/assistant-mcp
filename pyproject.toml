[project]
name = "assistant-mcp"
version = "0.1.0"
description = "Modular MCP server built on FastMCP, deployed on Cloud Run"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.0",
    "markdown-it-py>=3.0.0",
    "reportlab>=4.2.0",
]

[project.scripts]
assistant-mcp = "assistant_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_mcp"]

[dependency-groups]
dev = [
    "pypdf>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "types-reportlab>=3.6.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
