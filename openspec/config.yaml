schema: spec-driven
context: |
  Language: de
  All artifacts must be written in de.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
rules:
  tasks:
    - Test-Driven Development is mandatory for all implementation tasks.
    - Structure tasks as red-green cycles: first write the failing test, then
      only enough code to pass it. Never write implementation before a failing
      test exists.
    - Tests verify behavior at pre-agreed public seams, never implementation
      details. Agree the seams in the design before tasks are written.
    - Work in vertical slices: one test -> one minimal implementation -> repeat.
      No horizontal slicing (all tests first, then all implementation).
    - Expected values in tests must come from an independent source of truth
      (known-good literal, worked example, the spec), never recomputed the way
      the code does.
    - Refactoring belongs to the review stage, not the red-green cycle.
  design:
    - Document the seams (public interfaces) to test at and what each seam
      catches and misses.
operations:
  apply:
    guidance:
      - Implement test-first: write the failing test, run it to confirm it
        fails for the expected reason, then write the minimal implementation.
      - Run the narrow relevant test first, then the wider suite before marking
        a task complete. Keep test summaries concise.
      - Only mark a task complete when its tests pass.
  archive:
    guidance:
      - Before archiving, capture any strategically critical information from
        proposal, design, and tasks into the main spec or AGENTS.md.
      - Delete transient planning artifacts after the sync: only specs persist.
