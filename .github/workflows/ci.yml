name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Lint, types, and tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint GitHub Actions workflows (actionlint 1.7.12)
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - name: Lint markdown (markdownlint-cli2 0.24.0)
        run: npx --yes markdownlint-cli2@0.24.0
      - name: Lint commit messages (commitlint 21.2.4)
        run: |
          git fetch --tags origin
          FROM=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          npx --yes -p @commitlint/cli@21.2.4 -p @commitlint/config-conventional@21.2.4 \
            commitlint --from="$FROM" --to=HEAD
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  docker:
    name: Build image and run tests inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (layer-cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: assistant-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run test suite inside the image
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}":/src:ro
          -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e FORBID_SKIPPED_TESTS=1 assistant-mcp:ci
          sh -c "cd /src && uv sync --frozen && uv run --no-sync pytest"
